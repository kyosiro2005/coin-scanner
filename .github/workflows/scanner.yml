name: Run Coin Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기 📥
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 라이브러리 설치 📦
        run: |
          pip install requests

      - name: 스캐너 실행 🚀
        run: python scanner.py
