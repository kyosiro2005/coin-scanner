name: Run Coin Scanner

on:
  schedule:
    # ⏱️ 매시간 정각마다 실행 (필요시 시간 조정 가능)
    - cron: '0 * * * *'
  workflow_dispatch: # 👆 수동 버튼 실행 허용

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기 📥
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 스캐너 실행 🚀
        run: python scanner.py
